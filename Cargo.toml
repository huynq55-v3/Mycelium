[workspace]
resolver = "2"
members = [
    "crates/core-crypto",
    "crates/erasure-codec",
    "crates/blockstore",
    "crates/quota-manager",
    "crates/network",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Mycelium Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Async Runtime
tokio = { version = "1.43", features = ["full", "signal"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11"

# Error Handling & Logging
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI & UX
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.17"

# Cryptography & Utils
ed25519-dalek = { version = "2.1", features = ["rand_core", "serde"] }
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
hex = { version = "0.4", features = ["serde"] }
dirs = "6.0"

# Erasure Coding
reed-solomon-erasure = "6.0"

# Embedded Key-Value Storage
sled = "0.34"

# HTTP Client
reqwest = { version = "0.12", features = ["json"] }

# Libp2p Networking
libp2p = { version = "0.54", features = [
    "tokio",
    "tcp",
    "noise",
    "yamux",
    "mdns",
    "kad",
    "request-response",
    "pnet",
    "cbor",
    "serde",
    "identify",
    "ping"
] }

# Internal Crates
core-crypto = { path = "crates/core-crypto" }
erasure-codec = { path = "crates/erasure-codec" }
blockstore = { path = "crates/blockstore" }
quota-manager = { path = "crates/quota-manager" }
network = { path = "crates/network" }
cli = { path = "crates/cli" }
